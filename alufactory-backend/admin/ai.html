<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 额度管理</title>
<style>body{font:15px system-ui;background:#f4f6fa;color:#172336;margin:0;padding:24px}main{max-width:960px;margin:auto}section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0}input,button,select{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}button{cursor:pointer;background:#eff5ff}label{display:inline-block}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#b91c1c}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}</style>
<main><a href="/admin/">← 返回后台</a> · <a href="/admin/ai-faq.html">AI 问答规则库</a><h1>AI 额度与充值管理</h1><p id="error" role="alert"></p>
<section><h2>全局设置</h2><p id="provider"></p><label><input id="globalEnabled" type="checkbox">启用 AI 咨询</label><label>使用加价 % <input id="markup" type="number" min="0" max="100" step="0.01" value="10"></label><button id="saveSettings">保存设置</button></section>
<section><h2>全站待核对请求（含游客）</h2><pre id="globalPending"></pre><input id="globalResolveId" placeholder="待核对请求 ID"><input id="globalResolveReason" placeholder="核对说明"><button id="globalResolve">关闭异常请求（不扣客户额度）</button></section><section><h2>查找客户</h2><input id="phone" placeholder="手机号" aria-label="客户手机号"><button id="search">搜索</button><div id="users"></div></section>
<section id="accountPanel" hidden><h2 id="customer"></h2><p id="balance"></p><label><input id="accountEnabled" type="checkbox">启用该客户 AI</label><label>免费消息上限 <input id="trial" type="number" min="0" max="10000"></label><br><label>增加/扣减额度 ¥ <input id="delta" type="number" step="0.01" value="0"></label><input id="reason" placeholder="原因/微信交易号（必填）" maxlength="500"><button id="adjust">保存调整</button><p>微信：核对实际收款后填写增加金额及交易号。支付宝已自动到账的充值请勿重复手动增加。调整不会改变会员等级。</p><h3>待核对请求</h3><pre id="pending"></pre><input id="resolveId" placeholder="待核对请求 ID"><input id="resolveReason" placeholder="核对说明"><button id="resolve">关闭异常请求（不扣客户额度）</button><h3>最近 50 条账本</h3><table><thead><tr><th>时间</th><th>类型</th><th>额度变动</th><th>API 成本</th><th>详情</th></tr></thead><tbody id="ledger"></tbody></table></section></main>
<script>
const el=id=>document.getElementById(id);let userId=null;let adjustmentId=crypto.randomUUID();
async function api(path,data){const token=localStorage.getItem('authToken');if(!token){location.href='/admin/login.html';throw Error('请先登录');}const response=await fetch('/api'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data===undefined?undefined:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;}
function run(fn){return async()=>{el('error').textContent='';try{await fn();}catch(e){el('error').textContent=e.message;}}}
async function loadSettings(){const s=await api('/ai/admin');el('globalPending').textContent=JSON.stringify(s.pending,null,2);el('globalEnabled').checked=s.enabled;el('markup').value=s.markup_bps/100;el('provider').textContent=s.model+' · '+(s.configured?'已配置密钥和地址':'未配置密钥或地址');}
el('saveSettings').onclick=run(async()=>{await api('/ai/admin',{enabled:el('globalEnabled').checked,markup_bps:Math.round(Number(el('markup').value)*100)});await loadSettings();});
async function loadUser(id,name){userId=id;const a=await api('/ai/admin/users/'+encodeURIComponent(id));el('accountPanel').hidden=false;el('customer').textContent=name;el('balance').textContent=`余额 ¥${a.balance_cny.toFixed(4)} · 累计赠送 ¥${a.granted_cny} · 免费消息已用 ${a.trial_used} 条`;el('accountEnabled').checked=a.enabled;el('trial').value=a.trial_limit;el('pending').textContent=JSON.stringify(a.pending,null,2);el('ledger').replaceChildren();for(const entry of a.entries){const tr=document.createElement('tr');for(const value of [new Date(entry.time).toLocaleString(),entry.kind,entry.delta_cny.toFixed(8),entry.api_cost_cny.toFixed(8),JSON.stringify(entry.detail)]){const td=document.createElement('td');td.textContent=value;tr.append(td);}el('ledger').append(tr);}}
el('search').onclick=run(async()=>{const result=await api('/admin/users?per_page=30&phone='+encodeURIComponent(el('phone').value));el('users').replaceChildren();for(const user of result.users){const button=document.createElement('button');button.textContent=user.phone+' · '+user.username+' · '+user.membership_level;button.onclick=run(()=>{adjustmentId=crypto.randomUUID();return loadUser(user.id,user.phone+' '+user.username);});el('users').append(button);}if(!result.users.length)el('users').textContent='未找到客户。';});
el('adjust').onclick=run(async()=>{if(!userId)return;const button=el('adjust');button.disabled=true;try{await api('/ai/admin/users/'+encodeURIComponent(userId),{operation_id:adjustmentId,delta_cny:el('delta').value,reason:el('reason').value,enabled:el('accountEnabled').checked,trial_limit:Number(el('trial').value)});adjustmentId=crypto.randomUUID();el('delta').value='0';el('reason').value='';await loadUser(userId,el('customer').textContent);}finally{button.disabled=false;}});
el('resolve').onclick=run(async()=>{await api('/ai/admin/reconcile',{request_id:el('resolveId').value,reason:el('resolveReason').value});await loadUser(userId,el('customer').textContent);});
el('globalResolve').onclick=run(async()=>{await api('/ai/admin/reconcile',{request_id:el('globalResolveId').value,reason:el('globalResolveReason').value});await loadSettings();});
run(loadSettings)();
</script></html>
